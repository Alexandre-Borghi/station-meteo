<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e1a" />
    <meta name="description" content="Station météo — horloge et météo en temps réel" />

    <title>Station Météo</title>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch.png" />

    <link rel="preconnect" href="https://api.open-meteo.com" />
    <link rel="preconnect" href="https://geocoding-api.open-meteo.com" />

    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

    <!-- ===== Main display ===== -->
    <main id="main">

        <!-- Top bar: weather condition + settings -->
        <header id="topbar">
            <div id="condition">
                <span id="condition-icon" aria-hidden="true"></span>
                <span id="condition-label">—</span>
            </div>
            <button id="settings-btn" type="button" aria-label="Ouvrir les paramètres" title="Paramètres">
                <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </button>
        </header>

        <!-- Clock -->
        <div id="clock" role="timer" aria-label="Heure actuelle">
            <span id="clock-hm">--:--</span><span id="clock-ss">:--</span>
        </div>

        <!-- Weather cards -->
        <div id="weather">
            <div id="exterior" class="weather-card">
                <div class="temp" id="temp-exterior">--</div>
                <div class="label">Extérieur</div>
            </div>
            <div id="apparent" class="weather-card">
                <div class="temp" id="temp-apparent">--</div>
                <div class="label">Ressenti</div>
            </div>
        </div>

        <!-- Location name -->
        <div id="location-name">—</div>

    </main>

    <!-- ===== Settings panel (modal) ===== -->
    <div id="settings-overlay" hidden>
        <div id="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">

            <div id="settings-header">
                <h2 id="settings-title">Paramètres</h2>
                <button id="settings-close" type="button" aria-label="Fermer">&times;</button>
            </div>

            <div id="settings-body">

                <!-- Search -->
                <div id="search-row">
                    <input
                        type="search"
                        id="search-input"
                        placeholder="Rechercher une ville, une adresse…"
                        autocomplete="off"
                        aria-label="Rechercher une ville"
                    />
                    <button id="search-btn" type="button">Rechercher</button>
                </div>

                <button id="geoloc-btn" type="button">
                    <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polygon points="3 11 22 2 13 21 11 13 3 11"/>
                    </svg>
                    Utiliser ma position
                </button>

                <!-- Search results -->
                <ul id="search-results" hidden></ul>

                <!-- Map (lazy-loaded) -->
                <div id="map-container" hidden>
                    <div id="map"></div>
                </div>

                <!-- Selected location -->
                <div id="selected-location">
                    <span id="selected-label">Aucune position sélectionnée</span>
                </div>

            </div>

            <div id="settings-footer">
                <button id="save-btn" type="button" disabled>Enregistrer</button>
            </div>

        </div>
    </div>

    <!-- ===== Screen lock prevention (silent looping video) ===== -->
    <video id="fake-video" loop muted playsinline aria-hidden="true">
        <source type="video/webm" src="data:video/webm;base64,GkXfo0AgQoaBAUL3gQFC8oEEQvOBCEKCQAR3ZWJtQoeBAkKFgQIYU4BnQI0VSalmQCgq17FAAw9CQE2AQAZ3aGFtbXlXQUAGd2hhbW15RIlACECPQAAAAAAAFlSua0AxrkAu14EBY8WBAZyBACK1nEADdW5khkAFVl9WUDglhohAA1ZQOIOBAeBABrCBCLqBCB9DtnVAIueBAKNAHIEAAIAwAQCdASoIAAgAAUAmJaQAA3AA" />
    </video>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
