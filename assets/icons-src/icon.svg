<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1628"/>
      <stop offset="100%" stop-color="#1a2a4a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd54a"/>
      <stop offset="100%" stop-color="#ff8c1a"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8ecf4"/>
      <stop offset="100%" stop-color="#a8b8d0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>

  <!-- Sun (top-right, peeking) -->
  <circle cx="340" cy="180" r="72" fill="url(#sun)"/>
  <!-- Sun rays -->
  <g stroke="#ffb830" stroke-width="14" stroke-linecap="round">
    <line x1="340" y1="72"  x2="340" y2="100"/>
    <line x1="340" y1="260" x2="340" y2="288"/>
    <line x1="232" y1="180" x2="260" y2="180"/>
    <line x1="420" y1="180" x2="448" y2="180"/>
    <line x1="264" y1="104" x2="284" y2="124"/>
    <line x1="396" y1="236" x2="416" y2="256"/>
    <line x1="416" y1="104" x2="396" y2="124"/>
    <line x1="284" y1="236" x2="264" y2="256"/>
  </g>

  <!-- Cloud (front, bottom-left) -->
  <path d="
    M 160 340
    a 56 56 0 0 1 8 -111
    a 72 72 0 0 1 136 -22
    a 48 48 0 0 1 24 133
    z
    " fill="url(#cloud)" transform="translate(20, 10)"/>

  <!-- Clock hands inside cloud area (subtle) -->
  <g stroke="#1a2a4a" stroke-width="10" stroke-linecap="round" opacity="0.35">
    <line x1="230" y1="300" x2="230" y2="260"/>
    <line x1="230" y1="300" x2="262" y2="316"/>
  </g>
  <circle cx="230" cy="300" r="8" fill="#1a2a4a" opacity="0.35"/>
</svg>
